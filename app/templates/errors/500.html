{% extends "base.html" %}
{% block title %}Errore — {{ app_name }}{% endblock %}
{% block content %}
<div class="empty-state">
  <i data-lucide="alert-triangle" class="icon"></i>
  <h2>Qualcosa è andato storto</h2>
  <p>Riprova tra qualche istante. Se il problema persiste, controlla i log del container Docker.</p>
  <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary" style="margin-top:16px;">
    <i data-lucide="home" class="icon"></i> Torna alla dashboard
  </a>
</div>
{% endblock %}
